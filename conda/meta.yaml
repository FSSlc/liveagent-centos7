# =============================================================================
# Conda recipe for the pre-built LiveAgent bundle.
#
# `bash build.sh` produces output/liveagent-centos7-x86_64.tar.gz and
# `bash conda/build-conda.sh` copies it here before `conda build`.
# Binaries are patched for the target prefix at install time (post-link.sh).
# =============================================================================

{% set name = "liveagent" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: .

build:
  number: 0
  string: centos7_0

requirements:
  # post-link.sh rewrites interpreter/RPATH for the install prefix
  run:
    - patchelf

about:
  home: https://github.com/Stack-Cairn/LiveAgent
  summary: LiveAgent v1.3.0 — packaged for CentOS 7 with bundled glibc 2.39
  description: |
    LiveAgent v1.3.0 bundled with all runtime dependencies, including Ubuntu
    24.04 glibc 2.39, GTK3, WebKitGTK and Mesa. An ld-linux bootstrap lets the
    app run on CentOS 7 (glibc 2.17); patchelf is applied at install time so
    the package is relocatable.
