# =============================================================================
# LiveAgent Constructor installer (self-extracting .sh) for CentOS 7.
#
# Build (from the repo root):
#   bash build.sh                      # 1. bundle  -> output/liveagent-centos7-x86_64.tar.gz
#   bash conda/build-conda.sh          # 2. conda package + this installer
#
# Output: output/liveagent-<version>-Linux-x86_64.sh
# Install: bash liveagent-<version>-Linux-x86_64.sh -b -p ~/liveagent && ~/liveagent/bin/liveagent
# =============================================================================

{% set name = "liveagent" %}
{% set version = os.environ.get("LIVEAGENT_VERSION") %}

name: {{ name }}
version: "{{ version }}"

channels:
  - ./output/conda-channel
  - https://prefix.dev/scns

specs:
  - liveagent {{ version }} centos7_0

# Patches the bundle for the chosen install prefix (also runs as conda post-link).
post_install: conda/post-link.sh

installer_filename: liveagent-{{ version }}-Linux-x86_64.sh
initialize_by_default: false
register_python_default: false
